/* Direction : chaleureux et joueur. Formes rondes et épaisses, une couleur douce par type de carte, une lune en fil rouge. */
:root {
  --bg: #fbf0e0;
  --card: #fffaf2;
  --ink: #4a2e24;
  --muted: #8b6e5f;
  --line: #ecd9c0;
  --accent: #e08a2c;
  --accent-ink: #ffffff;
  --saviez-bg: #ffecb0;  --saviez-ink: #7a5600;
  --action-bg: #ffd8cc;  --action-ink: #8c3a28;
  --reflexion-bg: #d5efd9; --reflexion-ink: #2c6a44;
  --quiz-bg: #e2dcfb;    --quiz-ink: #4a3c93;
  --shadow: 0 4px 0 rgba(74,46,36,.10);
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #271915; --card: #35241e; --ink: #f6e6d3; --muted: #bfa592; --line: #4d362c;
    --accent: #f0a04a; --accent-ink: #2a1a10;
    --saviez-bg: #4a3b14; --saviez-ink: #ffe38a;
    --action-bg: #4d2a22; --action-ink: #ffc2b2;
    --reflexion-bg: #24402d; --reflexion-ink: #b4e6c2;
    --quiz-bg: #352f5c; --quiz-ink: #cfc6ff;
    --shadow: 0 4px 0 rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #271915; --card: #35241e; --ink: #f6e6d3; --muted: #bfa592; --line: #4d362c;
  --accent: #f0a04a; --accent-ink: #2a1a10;
  --saviez-bg: #4a3b14; --saviez-ink: #ffe38a;
  --action-bg: #4d2a22; --action-ink: #ffc2b2;
  --reflexion-bg: #24402d; --reflexion-ink: #b4e6c2;
  --quiz-bg: #352f5c; --quiz-ink: #cfc6ff;
  --shadow: 0 4px 0 rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); padding-top: calc(16px + env(safe-area-inset-top)); }

/* En-tête */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.moon { width: 46px; height: 46px; flex: none; }
.top h1 { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.1; margin: 0; }
.top p { margin: 0; color: var(--muted); font-size: 14px; font-weight: 600; }
.beads { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 18px; }
.beads i { width: calc((100% - 29 * 4px) / 30); min-width: 6px; height: 8px; border-radius: 4px; background: var(--line); display: block; }
.beads i.on { background: var(--accent); }
.beads i.now { background: var(--ink); }

.banner { background: var(--quiz-bg); color: var(--quiz-ink); border-radius: 14px; padding: 8px 12px; font-size: 14px; font-weight: 700; margin-bottom: 14px; }

/* Mot d'accompagnement */
.hello { font-family: var(--display); font-weight: 500; font-size: 21px; line-height: 1.3; margin: 0 0 14px; text-wrap: balance; }

/* Carte du jour */
.card { border-radius: 28px; padding: 22px 20px 20px; box-shadow: var(--shadow); }
.card.saviez { background: var(--saviez-bg); color: var(--saviez-ink); }
.card.action { background: var(--action-bg); color: var(--action-ink); }
.card.reflexion { background: var(--reflexion-bg); color: var(--reflexion-ink); }
.card.quiz { background: var(--quiz-bg); color: var(--quiz-ink); }
/* Accueil avant Ramadan : une lanterne qui se balance */
.accueil { text-align: center; overflow: hidden; padding-top: 0; }
.accueil .card { text-align: left; margin-top: 8px; }
.accueil .sub { margin: 0 auto 10px; max-width: 34ch; }
.accueil .petit { font-size: 14px; }
.prepa { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 16px 18px; margin: 16px 0 12px; }
.prepa h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0 0 8px; }
.prepa ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.prepa li { position: relative; padding-left: 26px; }
.prepa li::before { content: ""; position: absolute; left: 2px; top: .45em; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.lampe { display: block; margin: -10px auto 0; width: 220px; background: none; border: 0; padding: 0; border-radius: 24px; -webkit-tap-highlight-color: transparent; }
.lampe svg { width: 100%; height: auto; display: block; overflow: visible; }
.balance, .pendule, .queue { transform-box: view-box; }
.balance { transform-origin: 120px -40px; }
.pendule { transform-origin: 120px -40px; }
.queue { transform-box: fill-box; transform-origin: 0% 100%; }
.lueur { opacity: .8; }
@media (prefers-reduced-motion: no-preference) {
  .lueur { animation: respire 3.200s ease-in-out infinite alternate; }
  .queue { animation: queue 2.600s ease-in-out infinite alternate; }
  .yeux { animation: cligne2 5s ease-in-out infinite; }
  .lampe:hover .yeux, .lampe.agite .yeux { animation: cligne 2s ease-out; }
  .lampe:hover .queue, .lampe.agite .queue { animation: queue .5s ease-in-out infinite alternate; }
}
@keyframes veille { from { transform: rotate(-1.500deg); } to { transform: rotate(1.500deg); } }
@keyframes respire { from { opacity: .55; } to { opacity: 1; } }
@keyframes queue { from { transform: rotate(-6deg); } to { transform: rotate(10deg); } }
@keyframes swing { 0% { transform: rotate(0); } 18% { transform: rotate(13deg); } 42% { transform: rotate(-10deg); } 62% { transform: rotate(6deg); } 82% { transform: rotate(-3deg); } 100% { transform: rotate(0); } }
@keyframes cligne2 { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
@keyframes cligne { 0%, 30% { transform: scaleY(1); } 35% { transform: scaleY(.1); } 45%, 100% { transform: scaleY(1); } }
.yeux { transform-box: fill-box; transform-origin: center; }
.card.vide { background: var(--card); color: var(--muted); border: 2px dashed var(--line); box-shadow: none; }
.badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.55); border-radius: 999px; padding: 4px 14px 4px 8px; font-weight: 700; font-size: 14px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { background: rgba(0,0,0,.25); } }
:root[data-theme="dark"] .badge { background: rgba(0,0,0,.25); }
.badge svg { width: 22px; height: 22px; }
.card h2 { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.2; margin: 14px 0 8px; text-wrap: balance; }
.card p { margin: 0; color: var(--ink); }
.card .src { margin-top: 14px; font-size: 14px; opacity: .85; }
.card .src b { font-weight: 700; }
.en-bref h3 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 16px 0 4px; }
.en-bref p + h3 { margin-top: 16px; }
.card .relire { margin-top: 10px; font-size: 13px; font-weight: 700; opacity: .8; }

/* Quiz */
.choices { display: grid; gap: 10px; margin-top: 14px; }
.choice { text-align: left; background: var(--card); border: 2px solid transparent; border-radius: 18px; padding: 12px 16px; font-weight: 700; color: var(--ink); box-shadow: var(--shadow); }
.choice:hover { border-color: var(--quiz-ink); }
.choice.ok { background: var(--reflexion-bg); color: var(--reflexion-ink); border-color: var(--reflexion-ink); }
.choice.ko { background: var(--action-bg); color: var(--action-ink); border-color: var(--action-ink); }
.choice[disabled] { cursor: default; }
.verdict { margin-top: 14px; font-weight: 700; }

/* Navigation entre jours */
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
.pbtn { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 8px 16px; font-weight: 700; box-shadow: var(--shadow); }
.pbtn[disabled] { opacity: .4; cursor: default; box-shadow: none; }

/* Calendrier */
.screen-title { font-family: var(--display); font-weight: 600; font-size: 26px; margin: 4px 0 4px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.day { aspect-ratio: 1; border-radius: 20px; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--display); font-weight: 600; font-size: 22px; box-shadow: var(--shadow); background: var(--card); }
.day small { width: 16px; height: 16px; display: block; }
.day small svg { width: 100%; height: 100%; }
.day.saviez { background: var(--saviez-bg); color: var(--saviez-ink); }
.day.action { background: var(--action-bg); color: var(--action-ink); }
.day.reflexion { background: var(--reflexion-bg); color: var(--reflexion-ink); }
.day.quiz { background: var(--quiz-bg); color: var(--quiz-ink); }
.day.ouvert { border-color: var(--line); }
.day.today { background: var(--accent); color: var(--accent-ink); border-color: var(--ink); }
.day.sel { outline: 3px solid var(--ink); outline-offset: 2px; }
.day.futur { background: transparent; border: 2px dashed var(--line); color: var(--muted); box-shadow: none; opacity: .75; cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 18px; font-size: 14px; font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 5px; display: block; }

/* À propos */
.box { background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 18px; margin-bottom: 14px; }
.box h3 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0 0 6px; }
.box p { margin: 0 0 8px; }
.box p:last-child { margin: 0; }
.range { width: 100%; accent-color: var(--accent); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); }

/* Barre d'onglets */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 2px solid var(--line); }
.tabs nav { display: flex; width: 100%; max-width: 480px; gap: 8px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; border-radius: 18px; padding: 6px 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.tab[aria-current="page"] svg { color: var(--accent); }

@media (prefers-reduced-motion: no-preference) {
  .card, .box, .day { transition: transform .15s ease; }
  .day:not(.futur):active, .pbtn:active, .choice:active { transform: translateY(2px); }
  .card { animation: pop .35s ease both; }
  @keyframes pop { from { transform: translateY(8px); opacity: .0; } to { transform: none; opacity: 1; } }
}
</style>

  '<svg viewBox="0 0 240 330" aria-hidden="true">' +
  '<defs><radialGradient id="lueur"><stop offset="0" stop-color="#ffd98a" stop-opacity=".95"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>' +
  '<linearGradient id="verre" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f09a3a"/></linearGradient></defs>' +
  '<g class="balance"><g class="pendule">' +
    '<circle class="lueur" cx="120" cy="200" r="105" fill="url(#lueur)"/>' +
    '<line x1="120" y1="-40" x2="120" y2="92" stroke="#6b4a3b" stroke-width="3" stroke-linecap="round"/>' +
    /* queue du chat, derrière */
    '<g class="queue"><path d="M142 118 q26 -2 20 -30" fill="none" stroke="#8d6a56" stroke-width="8" stroke-linecap="round"/></g>' +
    /* lanterne */
    '<path d="M80 150 Q120 98 160 150 Z" fill="#6b4a3b"/>' +
    '<rect x="82" y="148" width="76" height="11" rx="5" fill="#523529"/>' +
    '<path d="M88 159 H152 L158 232 Q158 254 120 256 Q82 254 82 232 Z" fill="url(#verre)"/>' +
    '<path d="M120 159 V256 M101 159 L97 255 M139 159 L143 255" stroke="#523529" stroke-width="3" opacity=".75"/>' +
    '<path d="M126 196 a17 17 0 1 0 0 34 a13 13 0 0 1 0 -34z" fill="#fff3d0"/>' +
    '<path d="M138 200 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#fff3d0"/>' +
    '<rect x="90" y="256" width="60" height="11" rx="5" fill="#523529"/>' +
    '<line x1="120" y1="267" x2="120" y2="292" stroke="#6b4a3b" stroke-width="3"/><circle cx="120" cy="298" r="7" fill="#e08a2c"/>' +
    /* chat assis sur le dessus */
    '<ellipse cx="120" cy="124" rx="25" ry="19" fill="#8d6a56"/><ellipse cx="120" cy="131" rx="14" ry="10" fill="#f3dcc6"/>' +
    '<circle cx="120" cy="94" r="17" fill="#8d6a56"/>' +
    '<path d="M106 84 L108 66 L121 78z M134 84 L132 66 L119 78z" fill="#8d6a56"/><path d="M110 80 L110.500 71 L117 77z M130 80 L129.500 71 L123 77z" fill="#f0b9a8"/>' +
    '<g class="yeux"><circle cx="112.500" cy="92" r="4.600" fill="#fffaf0"/><circle cx="127.500" cy="92" r="4.600" fill="#fffaf0"/>' +
    '<g class="pupilles"><circle cx="112.500" cy="92.500" r="2.800" fill="#3b2a22"/><circle cx="127.500" cy="92.500" r="2.800" fill="#3b2a22"/><circle cx="113.600" cy="91.300" r="1" fill="#fff"/><circle cx="128.600" cy="91.300" r="1" fill="#fff"/></g></g>' +
    '<path d="M117.500 100 h5 l-2.500 3z" fill="#e58f8f"/><path d="M120 103 q-3 3 -6 1 M120 103 q3 3 6 1" fill="none" stroke="#3b2a22" stroke-width="1.400" stroke-linecap="round"/>' +
    '<path d="M104 99 h-9 M104 103 l-8 3 M136 99 h9 M136 103 l8 3" stroke="#3b2a22" stroke-width="1.200" stroke-linecap="round" opacity=".6"/>' +
  '</g></g></svg>';

function entete() {
  var j = jourMax(), pts = "";
  for (var n = 1; n <= NB; n++) pts += '<i class="' + (n === j ? "now" : n < j ? "on" : "") + '"></i>';
  var sous = jour() < 1 ? "" : "Jour " + j + " sur " + NB;
  return '<header class="top"><div><h1>Sirajy</h1>' + (sous ? '<p>' + sous + '</p>' : '') + '</div></header>' +
    '<div class="beads" aria-hidden="true">' + pts + '</div>' +
    (etat.apercu ? '<div class="banner">Aperçu : le jour ' + etat.jourApercu + ' est simulé. Réglage dans « À propos ».</div>' : "");
}

function carte(n) {
  var c = CONTENUS[n];
  if (!c) return '<section class="card vide"><h2>Bientôt, in cha Allah</h2><p>Le contenu de ce jour arrive. Reviens vite.</p></section>';
  var h = '<section class="card ' + c.type + '"><span class="badge">' + ico(c.type) + TYPES[c.type].nom + '</span><h2>' + esc(c.titre) + '</h2>';
  if (c.type === "quiz") {
    var rep = etat.reponses[n];
    h += '<p>' + esc(c.question) + '</p><div class="choices">';
    c.choix.forEach(function (t, i) {
      var cls = "choice", dis = "";
      if (rep !== undefined) { dis = " disabled"; if (i === c.bonne) cls += " ok"; else if (i === rep) cls += " ko"; }
      h += '<button class="' + cls + '" data-rep="' + i + '"' + dis + '>' + esc(t) + '</button>';
    });
    h += '</div>';
    if (rep !== undefined) h += '<p class="verdict">' + (rep === c.bonne ? "Bravo, c'est ça ! " : "Pas tout à fait, mais tu y étais presque. ") + esc(c.explication) + '</p>';
  } else {
    h += '<p>' + esc(c.texte) + '</p>';
  }
  if (c.source) h += '<p class="src"><b>Source</b> : ' + esc(c.source) + '</p>';
  if (c.verif) h += '<p class="relire">À relire : la référence de cette carte reste à vérifier.</p>';
  return h + '</section>';
}

/* ---------- Écrans ---------- */
function ecranAujourdhui() {
  var j = jour();
  if (j < 1) {
    return entete() + '<section class="accueil"><button class="lampe" type="button" aria-label="Lanterne avec un chat. Touche-la pour la balancer.">' + LANTERNE + '</button>' +
      '<section class="card reflexion"><span class="badge">' + ico("reflexion") + 'Intention du mois</span>' +
      '<h2>Ramadan commence par une intention</h2><p>Pourquoi veux-tu vivre ce mois, et qu\'aimerais-tu y chercher ?</p>' +
      '<p class="src"><b>Source</b> : Les actions valent par les intentions (Sahih al-Bukhari 1, Sahih Muslim 1907)</p></section>' +
      '<section class="card saviez en-bref"><span class="badge">' + ico("saviez") + 'En bref</span><h2>Ramadan, c\'est quoi ?</h2>' +
      '<h3>Le mois du jeûne</h3><p>Le mois du Ramadan est le neuvième mois du calendrier musulman. Chaque jour, de l\'aube au coucher du soleil, les musulmans jeûnent : ni manger, ni boire. C\'est l\'un des cinq piliers de l\'islam.</p>' +
      '<h3>D\'où ça vient ?</h3><p>C\'est durant ce mois que le Coran a commencé à être révélé. Le Coran dit aussi que le jeûne a été prescrit aux croyants, comme il l\'avait été à ceux d\'avant eux.</p>' +
      '<h3>À quoi ça sert ?</h3><p>Le Coran en donne le but : atteindre la piété (la taqwa). Beaucoup en profitent pour prier davantage, lire le Coran et donner autour d\'eux.</p>' +
      '<h3>Pourquoi les dates changent</h3><p>Le calendrier musulman est lunaire : un mois commence avec la nouvelle lune et dure 29 ou 30 jours. L\'année lunaire est plus courte d\'environ 11 jours que l\'année habituelle, donc Ramadan arrive environ 11 jours plus tôt chaque année. Le mois se termine par l\'Aïd al-Fitr.</p>' +
      '<p class="src"><b>Sources</b> : Coran, sourate Al-Baqara (2), versets 183 et 185 ; Sahih al-Bukhari 8, Sahih Muslim 16 (les cinq piliers).</p></section>' +
      '<div class="prepa"><h3>Pour te préparer</h3><ul><li>Prévois un moment calme chaque jour, même dix minutes.</li><li>Pense à une personne que tu aimerais inviter ou appeler.</li></ul></div>' +
      (PROTO ? '<p class="sub petit">Aperçu : active la simulation dans « À propos » pour voir les cartes.</p>' : '') + '</section>';
  }
  var max = jourMax(), n = etat.sel && etat.sel <= max ? etat.sel : max;
  var h = entete();
  if (j > NB) h += '<div class="banner">Ramadan est terminé. Tu peux relire tous les jours.</div>';
  h += '<p class="hello">' + (n === max ? mot(n) : "Jour " + n + ", relu avec calme.") + '</p>' + carte(n);
  h += '<div class="pager"><button class="pbtn" data-nav="-1"' + (n <= 1 ? " disabled" : "") + '>← Jour ' + (n - 1) + '</button>' +
       '<button class="pbtn" data-nav="1"' + (n >= max ? " disabled" : "") + '>Jour ' + (n + 1) + ' →</button></div>';
  return h;
}

function ecranCalendrier() {
  var j = jour(), max = jourMax(), sel = etat.sel && etat.sel <= max ? etat.sel : max;
  var h = entete() + '<h2 class="screen-title">Les 30 jours</h2><p class="sub">Touche un jour passé pour le relire. Les prochains s\'ouvrent le moment venu.</p><div class="grid">';
  for (var n = 1; n <= NB; n++) {
    var c = CONTENUS[n], ouvert = j >= 1 && n <= max, cls = "day";
    if (!ouvert) cls += " futur";
    else { cls += " ouvert" + (c ? " " + c.type : ""); if (n === max && j <= NB) cls += " today"; if (n === sel) cls += " sel"; }
    h += '<button class="' + cls + '" data-jour="' + n + '"' + (ouvert ? "" : " disabled") + ' aria-label="Jour ' + n + '">' + n + (ouvert && c ? '<small>' + ico(c.type) + '</small>' : "") + '</button>';
  }
  h += '</div><div class="legend">';
  [["saviez", "Le saviez-vous"], ["action", "Bonne action"], ["reflexion", "Réflexion"], ["quiz", "Quiz"]].forEach(function (t) {
    h += '<span><i style="background:var(--' + t[0] + '-bg)"></i>' + t[1] + '</span>';
  });
  return h + '</div>';
}

function ecranApropos() {
  return entete() + '<h2 class="screen-title">À propos</h2>' +
    '<div class="box"><h3>Qu\'est-ce que Sirajy ?</h3><p>Sirajy est un projet sobre, gratuit et sans publicité, pensé pour les musulmans francophones. Son idée : un rappel simple, sourcé, qui accompagne la journée sans la surcharger.</p><p>Ce site en est le compagnon de Ramadan : une carte par jour pendant 30 jours, avec un « le saviez-vous », une bonne action, une question pour réfléchir ou un mini-quiz.</p></div>' +
    '<div class="box"><h3>Rien n\'est collecté</h3><p>Pas de compte, pas de publicité, pas de suivi. Le site ne garde rien de toi.</p><p>Il utilise seulement la date du jour pour savoir quelle carte afficher. C\'est pour ça que tu peux relire les jours passés sans rien enregistrer.</p></div>' +
    '<div class="box"><h3>Les contenus</h3><p>Chaque carte donne sa source quand il y en a une. Les cartes marquées « À relire » attendent encore une vérification de leur référence.</p></div>' +
    (PROTO ? '<div class="box"><h3>Aperçu</h3><label class="switch"><input type="checkbox" id="apercu"' + (etat.apercu ? " checked" : "") + '> Simuler un jour de Ramadan</label>' +
    '<div class="row" style="margin-top:12px"><input class="range" id="jourApercu" type="range" min="1" max="' + NB + '" value="' + etat.jourApercu + '"' + (etat.apercu ? "" : " disabled") + ' aria-label="Jour simulé"><b id="valApercu">' + etat.jourApercu + '</b></div>' +
    '<p style="margin-top:10px;color:var(--muted);font-size:14px">Début de Ramadan configuré : ' + DEBUT[2] + '/' + (DEBUT[1] < 10 ? "0" : "") + DEBUT[1] + '/' + DEBUT[0] + ' (à confirmer).</p></div>' : '');
}

/* ---------- Rendu et événements ---------- */
var app = document.getElementById("app");
function rendre() {
  app.innerHTML = etat.tab === "calendrier" ? ecranCalendrier() : etat.tab === "apropos" ? ecranApropos() : ecranAujourdhui();
  document.querySelectorAll(".tab").forEach(function (b) {
    if (b.dataset.tab === etat.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}
function aller(t) {
  etat.tab = t;
  try { history.replaceState(null, "", "#" + t); } catch (e) {}
  rendre(); window.scrollTo(0, 0);
}
document.querySelector(".tabs").addEventListener("click", function (e) {
  var b = e.target.closest(".tab"); if (b) aller(b.dataset.tab);
});
app.addEventListener("click", function (e) {
  var l = e.target.closest(".lampe");
  if (l) { lampeEtat.vel += (Math.random() < 0.5 ? -1 : 1) * 1.4; l.classList.remove("agite"); void l.offsetWidth; l.classList.add("agite"); setTimeout(function () { l.classList.remove("agite"); }, 2100); return; }
  var d = e.target.closest("[data-jour]");
  if (d && !d.disabled) { etat.sel = +d.dataset.jour; aller("aujourdhui"); return; }
  var r = e.target.closest("[data-rep]");
  if (r) { var n = etat.sel && etat.sel <= jourMax() ? etat.sel : jourMax(); etat.reponses[n] = +r.dataset.rep; rendre(); return; }
  var p = e.target.closest("[data-nav]");
  if (p && !p.disabled) { var cur = etat.sel && etat.sel <= jourMax() ? etat.sel : jourMax(); etat.sel = cur + +p.dataset.nav; rendre(); window.scrollTo(0, 0); }
});
app.addEventListener("input", function (e) {
  if (e.target.id === "apercu") { etat.apercu = e.target.checked; etat.sel = null; rendre(); }
  if (e.target.id === "jourApercu") {
    etat.jourApercu = +e.target.value; etat.sel = null;
    document.getElementById("valApercu").textContent = etat.jourApercu;
    var h = document.querySelector(".top p"); if (h) h.textContent = "Jour " + etat.jourApercu + " sur " + NB;
    var ban = document.querySelector(".banner"); if (ban) ban.textContent = "Aperçu : le jour " + etat.jourApercu + " est simulé. Réglage dans « À propos ».";
    var bd = document.querySelectorAll(".beads i");
    bd.forEach(function (el, i) { el.className = (i + 1 === etat.jourApercu ? "now" : i + 1 < etat.jourApercu ? "on" : ""); });
  }
});
/* Lanterne : pendule à ressort qui penche vers le pointeur, yeux qui suivent en douceur */
var lampeEtat = { ang: 0, vel: 0, px: 0, py: 0, mx: null, my: null, t: 0 };
var reduit = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function bornes(v) { return Math.max(-1, Math.min(1, v)); }
window.addEventListener("pointermove", function (e) { lampeEtat.mx = e.clientX; lampeEtat.my = e.clientY; });
document.documentElement.addEventListener("mouseleave", function () { lampeEtat.mx = null; lampeEtat.my = null; });
var dernier = 0;
function boucle(now) {
  var dt = Math.min(2, (now - (dernier || now)) / 16.67); dernier = now;
  var l = document.querySelector(".lampe");
  if (l && !reduit) {
    var E = lampeEtat, r = l.getBoundingClientRect();
    var cx = r.left + r.width * 0.5, cy = r.top + r.height * 0.285;
    var dx = E.mx === null ? 0 : bornes((E.mx - cx) / 220);
    var dy = E.my === null ? 0 : bornes((E.my - cy) / 220);
    E.t += dt;
    var dessus = E.mx !== null && E.mx >= r.left && E.mx <= r.right && E.my >= r.top && E.my <= r.bottom;
    if (dessus && !E.dessus) E.vel += (E.mx < cx ? 1 : -1) * 1.3;
    E.dessus = dessus;
    var cible = Math.sin(E.t / 90) * 1.2;
    E.vel += (cible - E.ang) * 0.022 * dt;
    E.vel *= Math.pow(0.965, dt);
    E.ang += E.vel * dt;
    var pend = l.querySelector(".pendule"), pu = l.querySelector(".pupilles");
    if (pend) pend.style.transform = "rotate(" + E.ang.toFixed(2) + "deg)";
    var tx = dx * 3.2, ty = dy * 2.4, k = 1 - Math.pow(0.82, dt);
    E.px += (tx - E.px) * k; E.py += (ty - E.py) * k;
    if (pu) pu.style.transform = "translate(" + E.px.toFixed(2) + "px," + E.py.toFixed(2) + "px)";
  }
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);
window.addEventListener("hashchange", function () {
  var t = location.hash.slice(1);
  if (["aujourdhui", "calendrier", "apropos"].indexOf(t) >= 0 && t !== etat.tab) { etat.tab = t; rendre(); }
});
(function () {
  try {
    var q = new URLSearchParams(location.search).get("jour"), n = parseInt(q, 10);
    if (PROTO && n >= 1 && n <= NB) { etat.apercu = true; etat.jourApercu = n; }
  } catch (e) {}
  var t = location.hash.slice(1);
  if (["aujourdhui", "calendrier", "apropos"].indexOf(t) >= 0) etat.tab = t;
  rendre();
})();
</script>
</body>
</html>
