:root {
  --bg: #fbf0e0;
  --paper: #fffaf2;
  --paper-ink: #4a2e24;
  --ink: #4a2e24;
  --muted: #8b6e5f;
  --edge: #4a2e24;
  --accent: #e08a2c;
  --on-accent: #3a1d0c;
  --halo: rgba(240,160,74,.30);
  --star: rgba(139,110,95,.16);
  --saviez-bg: #ffecb0;  --saviez-ink: #7a5600;
  --action-bg: #ffd8cc;  --action-ink: #8c3a28;
  --reflexion-bg: #d5efd9; --reflexion-ink: #2c6a44;
  --quiz-bg: #e2dcfb;    --quiz-ink: #4a3c93;
  --ok: #bfe6c8; --ko: #ffc2b2;
  --display: "Grandstander", "Trebuchet MS", system-ui, sans-serif;
  --body: "Andika", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #271915; --paper: #35241e; --paper-ink: #f6e6d3; --ink: #f6e6d3; --muted: #bfa592; --edge: #120a08;
    --accent: #f0a04a; --halo: rgba(240,160,74,.18); --star: rgba(246,230,211,.14);
    --saviez-bg: #4a3b14; --saviez-ink: #ffe38a;
    --action-bg: #4d2a22; --action-ink: #ffc2b2;
    --reflexion-bg: #24402d; --reflexion-ink: #b4e6c2;
    --quiz-bg: #352f5c; --quiz-ink: #cfc6ff;
    --ok: #24402d; --ko: #4d2a22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #271915; --paper: #35241e; --paper-ink: #f6e6d3; --ink: #f6e6d3; --muted: #bfa592; --edge: #120a08;
  --accent: #f0a04a; --halo: rgba(240,160,74,.18); --star: rgba(246,230,211,.14);
  --saviez-bg: #4a3b14; --saviez-ink: #ffe38a; --action-bg: #4d2a22; --action-ink: #ffc2b2;
  --reflexion-bg: #24402d; --reflexion-ink: #b4e6c2; --quiz-bg: #352f5c; --quiz-ink: #cfc6ff;
  --ok: #24402d; --ko: #4d2a22; color-scheme: dark;
}
* { box-sizing: border-box; }
html { background-color: var(--bg); }
html, body { margin: 0; color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh; overflow-x: hidden;
  background:
    radial-gradient(90% 40% at 50% 0%, var(--halo), transparent 70%),
    radial-gradient(circle at 20px 30px, var(--star) 2px, transparent 2.5px) 0 0 / 74px 74px,
    radial-gradient(circle at 55px 8px, var(--star) 1.4px, transparent 2px) 0 0 / 74px 74px,
    var(--bg);
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.app { position: relative; max-width: 480px; margin: 0 auto; padding: 18px 18px calc(104px + env(safe-area-inset-bottom)); padding-top: calc(18px + env(safe-area-inset-top)); }

/* En-tête */
.top { gap: 10px; min-height: 84px; display: flex; align-items: flex-start; justify-content: flex-start; gap: 12px; margin-bottom: 12px; }
.top h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: -.01em; line-height: 1; margin: 0; color: var(--ink); text-shadow: 3px 3px 0 var(--halo); }
.top p { margin: 30px 0 0 auto; background: var(--paper); color: var(--paper-ink); border: 2.5px solid var(--edge); border-radius: 999px; padding: 2px 12px; font-family: var(--display); font-weight: 600; font-size: 14px; transform: rotate(2deg); box-shadow: 2px 2px 0 var(--edge); }
.beads { position: relative; z-index: 0; display: flex; justify-content: space-between; margin: 0 0 22px; }
.beads i { width: 8px; height: 8px; border-radius: 50%; background: transparent; border: 2px solid var(--muted); display: block; }
.beads i.on { background: var(--accent); border-color: var(--paper-ink); }
.beads i.now { background: var(--accent); border-color: var(--paper-ink); transform: scale(1.8); box-shadow: 0 0 0 3px var(--halo); }

.banner { background: var(--quiz-bg); color: var(--quiz-ink); border: 2.5px solid var(--edge); border-radius: 14px; padding: 6px 12px; font-size: 14px; font-weight: 700; margin-bottom: 16px; transform: rotate(-.8deg); box-shadow: 3px 3px 0 var(--edge); }

.hello { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.25; margin: 0 0 18px; text-wrap: balance; }

/* Types */
.saviez { --t: var(--saviez-bg); --ti: var(--saviez-ink); } .action { --t: var(--action-bg); --ti: var(--action-ink); }
.reflexion { --t: var(--reflexion-bg); --ti: var(--reflexion-ink); } .quiz { --t: var(--quiz-bg); --ti: var(--quiz-ink); }
:root { --t: var(--paper); --ti: var(--paper-ink); }

/* Carte du jour : un autocollant */
.card { background: var(--t); color: var(--ti); border: 3px solid var(--edge); border-radius: 30px 26px 32px 24px / 26px 32px 24px 30px; padding: 20px 20px 22px; box-shadow: 6px 6px 0 var(--edge); transform: rotate(-.5deg); }
.cardhead { display: flex; align-items: center; gap: 12px; }
.num { flex: none; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--paper); border: 3px solid var(--edge); font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; transform: rotate(-8deg); }

  var sous = jour() < 1 ? "" : "Jour " + j + " / " + NB;
  return '<header class="top"><div class="marque"><h1>Sirajy</h1><button class="lampe" type="button" aria-label="Lanterne avec un chat. Touche-la pour la balancer.">' + LANTERNE + '</button></div>' + (sous ? '<p>' + sous + '</p>' : '') + '<button class="aide" type="button" aria-label="À propos de Sirajy">?</button></header>' +
    (jour() < 1 ? "" : '<div class="beads" aria-hidden="true">' + pts + '</div>') +
    (etat.apercu ? '<div class="banner">Aperçu : le jour ' + etat.jourApercu + ' est simulé. Réglage dans « À propos ».</div>' : "");
}

/* Texte simple : ligne vide = nouveau paragraphe, « 1. » = liste numérotée, **gras**, *italique*, l'arabe est détecté tout seul */
function enligne(t) {
  return esc(t)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/([؀-ۿ]+(?:\s+[؀-ۿ]+)*)/g, '<span lang="ar" dir="rtl">$1</span>');
}
function texteRiche(t) {
  if (/^\s*</.test(t)) return t;
  return t.trim().split(/\n\s*\n/).map(function (bloc) {
    var l = bloc.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
    if (l.every(function (x) { return /^[-•]\s+/.test(x); }))
      return "<ul>" + l.map(function (x) { return "<li>" + enligne(x.replace(/^[-•]\s+/, "")) + "</li>"; }).join("") + "</ul>";
    if (l.every(function (x) { return /^\d+\.\s+/.test(x); }))
      return "<ol>" + l.map(function (x) { return "<li>" + enligne(x.replace(/^\d+\.\s+/, "")) + "</li>"; }).join("") + "</ol>";
    return "<p>" + enligne(l.join(" ")) + "</p>";
  }).join("");
}

/* Sources : référence, narrateur, grade… sur des lignes séparées, citation à part */
function srcHtml(label, s) {
  var q = "", i = s.indexOf("«");

  var parts = s.split(/\s+-\s+|\s+;\s+|,\s+(?=Grade\s*:)/).map(function (x) { return x.trim(); }).filter(Boolean);
  var h = '<div class="src"><span class="srctag">' + esc(label) + '</span>';
  if (parts.length) h += '<ul class="srcl">' + parts.map(function (p) {
    var m = p.match(/^([^:]{1,30}?)\s:\s(.+)$/);
    return '<li>' + (m ? '<b>' + esc(m[1]) + '</b> : ' + esc(m[2]) : esc(p)) + '</li>';
  }).join("") + '</ul>';
  if (q) h += '<blockquote>' + esc(q) + '</blockquote>';
  return h + '</div>';
}

function carte(n) {
  var c = CONTENUS[n];
  if (!c) return '<section class="card vide"><h2>Bientôt, in cha Allah</h2><p>Le contenu de ce jour arrive. Reviens vite.</p></section>';
  var h = '<section class="card ' + c.type + '"><div class="cardhead"><span class="num">' + (n < 10 ? "0" : "") + n + '</span><span class="badge">' + ico(c.type) + TYPES[c.type].nom + '</span></div><h2>' + esc(c.titre) + '</h2>';
  if (c.type === "quiz") {
    var rep = etat.reponses[n];
    h += '<p>' + esc(c.question) + '</p><div class="choices">';
    c.choix.forEach(function (t, i) {
      var cls = "choice", dis = "";
      if (rep !== undefined) { dis = " disabled"; if (i === c.bonne) cls += " ok"; else if (i === rep) cls += " ko"; }
      h += '<button class="' + cls + '" data-rep="' + i + '"' + dis + '><b>' + "ABCDEF".charAt(i) + '</b><span>' + esc(t) + '</span></button>';
    });
    h += '</div>';
    if (rep !== undefined) h += '<p class="verdict">' + (rep === c.bonne ? "Bravo, c'est ça ! " : "Pas tout à fait, mais tu y étais presque. ") + esc(c.explication) + '</p>';
  } else {
    h += '<div class="riche">' + texteRiche(c.texte) + '</div>';
  }
  if (c.source) h += srcHtml("Source", c.source);
  if (c.verif) h += '<p class="relire">À relire : la référence de cette carte reste à vérifier.</p>';
  return h + '</section>';
}

function carteRamadan() {
  return '<section class="card saviez en-bref"><div class="cardhead"><span class="badge">' + ico("saviez") + 'En bref</span></div><h2>Le mois du Ramadan, c\'est quoi ?</h2>' +
      '<h3>D\'où ça vient ?</h3><p>Pour nous, musulmans, ce mois est béni parce que c\'est durant le ramadan (en 610) que le Prophète Muhammad (paix et salut sur lui) a reçu les premières révélations du Coran par l\'intermédiaire de l\'ange Jibril lors d\'une nuit sacrée que nous appelons <em>Laylat al-Qadr</em> (la « Nuit du Destin »).</p><p>Quelques années plus tard, en 624, Allah nous a prescrit le jeûne de ce mois qui est devenu l\'un des <strong>cinq piliers de notre foi</strong> (aux côtés de l\'attestation de foi, des cinq prières quotidiennes, de l\'aumône légale et du pèlerinage à La Mecque).</p>' +
      '<h3>À quoi ça sert pour nous ?</h3><p>Le jeûne ne se résume pas à nous priver de nourriture, d\'eau, de tabac et de relations intimes de l\'aube au coucher du soleil. C\'est avant tout un cheminement spirituel :</p><ul><li><strong>Se rapprocher de Allah :</strong> C\'est un mois privilégié pour multiplier nos prières (notamment la nuit), méditer le Coran et demander pardon.</li><li><strong>Maîtriser son ego et se purifier :</strong> En résistant à nos besoins primaires par amour pour Dieu, nous apprenons la patience, l\'autodiscipline et nous purifions notre cœur des mauvaises habitudes.</li><li><strong>Cultiver l\'empathie et la générosité :</strong> Ressentir la faim et la soif nous rappelle concrètement ce que vivent les plus démunis au quotidien. Cela nous pousse à être encore plus généreux, à verser nos aumônes (la <em>Zakat</em> et la <em>Sadaqa</em>) et à offrir des repas.</li><li><strong>Renforcer nos liens fraternels :</strong> Les soirées sont des moments de partage intenses où nous nous retrouvons en famille, entre amis ou à la mosquée pour rompre le jeûne ensemble (l\'<em>Iftar</em>), ce qui soude notre communauté.</li></ul>' +
      '<h3>Pourquoi les dates changent-elles chaque année ?</h3><p>Les dates reculent d\'environ <strong>10 à 11 jours</strong> chaque année par rapport au calendrier civil (qui est solaire) :</p><ul><li>Le <strong>calendrier hégirien</strong> est strictement lunaire et rythmé par l\'observation des cycles de la Lune.</li><li>Une année lunaire compte 12 mois de 29 ou 30 jours, soit <strong>354 ou 355 jours</strong> au total.</li><li>Comme l\'année solaire dure 365 ou 366 jours, ce calendrier est plus court d\'une dizaine de jours. Pour nous, c\'est aussi une sagesse : cela permet au ramadan de traverser toutes les saisons sur un cycle d\'environ 33 ans, afin que chaque croyant sur Terre vive l\'épreuve et la beauté du jeûne aussi bien pendant les longues journées chaudes d\'été que les courtes journées d\'hiver.</li></ul>' +
      srcHtml("Sources", "Coran, sourate Al-Baqara (2), versets 183 et 185 ; Sahih al-Bukhari 8, Sahih Muslim 16 (les cinq piliers).") + '</section>';
}

function ecranRamadan() { return entete() + carteRamadan(); }

/* ---------- Écrans ---------- */
function ecranAujourdhui() {
  var j = jour();
  if (j < 1) {
    return entete() + '<section class="accueil">' +
      '<div class="prepa"><h3>Pour te préparer</h3><ul><li>Prévois un moment calme chaque jour, même dix minutes.</li><li>Pense à une personne que tu aimerais inviter ou appeler.</li></ul></div>' +
      (PROTO ? '<p class="sub petit">Aperçu : active la simulation dans « À propos » pour voir les cartes.</p>' : '') + '</section>';
  }
  var max = jourMax(), n = etat.sel && etat.sel <= max ? etat.sel : max;
  var h = entete();
  if (j > NB) h += '<div class="banner">Ramadan est terminé. Tu peux relire tous les jours.</div>';
  h += '<p class="hello">' + (n === max ? mot(n) : "Jour " + n + ".") + '</p>' + carte(n);
  h += '<div class="pager"><button class="pbtn" data-nav="-1"' + (n <= 1 ? " disabled" : "") + '>← Jour ' + (n - 1) + '</button>' +
       '<button class="pbtn" data-nav="1"' + (n >= max ? " disabled" : "") + '>Jour ' + (n + 1) + ' →</button></div>';
  return h;
}

function ecranCalendrier() {
  var j = jour(), max = jourMax(), sel = etat.sel && etat.sel <= max ? etat.sel : max;
  var h = entete() + '<h2 class="screen-title">Les 30 jours</h2><p class="sub">Touche un jour passé pour le relire. Les prochains s\'ouvrent le moment venu.</p><div class="grid">';
  for (var n = 1; n <= NB; n++) {
    var c = CONTENUS[n], ouvert = j >= 1 && n <= max, cls = "day";
    if (!ouvert) cls += " futur";
    else { if (c) cls += " " + c.type; if (n === max && j <= NB) cls += " today"; if (n === sel) cls += " sel"; }
    h += '<button class="' + cls + '" data-jour="' + n + '"' + (ouvert ? "" : " disabled") + ' aria-label="Jour ' + n + '">' + n + (ouvert && c ? '<small>' + ico(c.type) + '</small>' : "") + '</button>';
  }
  h += '</div><div class="legend">';
  [["saviez", "Apprentissage"], ["action", "Bonne action"], ["reflexion", "Réflexion"], ["quiz", "Quiz"]].forEach(function (x) {
    h += '<span class="' + x[0] + '"><i></i>' + x[1] + '</span>';
  });
  return h + '</div>';
}

function ecranApropos() {
  return entete() + '<h2 class="screen-title">À propos</h2>' +
    '<div class="box"><h3>Qu\'est-ce que Sirajy ?</h3><p>Ce site en est le compagnon de Ramadan : une carte par jour pendant 30 jours, avec un « le saviez-vous », une bonne action, une question pour réfléchir ou un mini-quiz.</p></div>' +
    '<div class="box"><h3>Les contenus</h3><p>Chaque carte donne sa source quand il y en a une. Les cartes marquées « À relire » attendent encore une vérification de leur référence.</p></div>' +
    (PROTO ? '<div class="box"><h3>Aperçu</h3><label class="switch"><input type="checkbox" id="apercu"' + (etat.apercu ? " checked" : "") + '> Simuler un jour de Ramadan</label>' +
    '<div class="row" style="margin-top:12px"><input class="range" id="jourApercu" type="range" min="1" max="' + NB + '" value="' + etat.jourApercu + '"' + (etat.apercu ? "" : " disabled") + ' aria-label="Jour simulé"><b id="valApercu">' + etat.jourApercu + '</b></div>' +
    '<p style="margin-top:10px;color:var(--muted);font-size:14px">Début de Ramadan configuré : ' + DEBUT[2] + '/' + (DEBUT[1] < 10 ? "0" : "") + DEBUT[1] + '/' + DEBUT[0] + ' (à confirmer).</p></div>' : '');
}

/* ---------- Rendu et événements ---------- */
var app = document.getElementById("app");
function rendre() {
  app.innerHTML = etat.tab === "calendrier" ? ecranCalendrier() : etat.tab === "ramadan" ? ecranRamadan() : etat.tab === "apropos" ? ecranApropos() : ecranAujourdhui();
  document.querySelectorAll(".tab").forEach(function (b) {
    if (b.dataset.tab === etat.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}
function aller(t) {
  etat.tab = t;
  try { history.replaceState(null, "", "#" + t); } catch (e) {}
  rendre(); window.scrollTo(0, 0);
}
document.querySelector(".tabs").addEventListener("click", function (e) {
  var b = e.target.closest(".tab"); if (b) aller(b.dataset.tab);
});
app.addEventListener("click", function (e) {
  var ai = e.target.closest(".aide");
  if (ai) { aller("apropos"); return; }
  var l = e.target.closest(".lampe");
  if (l) { lampeEtat.vel += (Math.random() < 0.5 ? -1 : 1) * 1.4; l.classList.remove("agite"); void l.offsetWidth; l.classList.add("agite"); setTimeout(function () { l.classList.remove("agite"); }, 2100); return; }
  var d = e.target.closest("[data-jour]");
  if (d && !d.disabled) { etat.sel = +d.dataset.jour; aller("aujourdhui"); return; }
  var r = e.target.closest("[data-rep]");
  if (r) { var n = etat.sel && etat.sel <= jourMax() ? etat.sel : jourMax(); etat.reponses[n] = +r.dataset.rep; rendre(); return; }
  var p = e.target.closest("[data-nav]");
  if (p && !p.disabled) { var cur = etat.sel && etat.sel <= jourMax() ? etat.sel : jourMax(); etat.sel = cur + +p.dataset.nav; rendre(); window.scrollTo(0, 0); }
});
app.addEventListener("input", function (e) {
  if (e.target.id === "apercu") { etat.apercu = e.target.checked; etat.sel = null; rendre(); }
  if (e.target.id === "jourApercu") {
    etat.jourApercu = +e.target.value; etat.sel = null;
    document.getElementById("valApercu").textContent = etat.jourApercu;
    var h = document.querySelector(".top p"); if (h) h.textContent = "Jour " + etat.jourApercu + " sur " + NB;
    var ban = document.querySelector(".banner"); if (ban) ban.textContent = "Aperçu : le jour " + etat.jourApercu + " est simulé. Réglage dans « À propos ».";
    var bd = document.querySelectorAll(".beads i");
    bd.forEach(function (el, i) { el.className = (i + 1 === etat.jourApercu ? "now" : i + 1 < etat.jourApercu ? "on" : ""); });
  }
});
/* Lanterne : pendule à ressort qui penche vers le pointeur, yeux qui suivent en douceur */
var lampeEtat = { ang: 0, vel: 0, px: 0, py: 0, mx: null, my: null, t: 0 };
var reduit = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function bornes(v) { return Math.max(-1, Math.min(1, v)); }
window.addEventListener("pointermove", function (e) { lampeEtat.mx = e.clientX; lampeEtat.my = e.clientY; });
document.documentElement.addEventListener("mouseleave", function () { lampeEtat.mx = null; lampeEtat.my = null; });
var dernier = 0;
function boucle(now) {
  var dt = Math.min(2, (now - (dernier || now)) / 16.67); dernier = now;
  var l = document.querySelector(".lampe");
  if (l && !reduit) {
    var E = lampeEtat, r = l.getBoundingClientRect();
    var cx = r.left + r.width * 0.5, cy = r.top + r.height * 0.285;
    var dx = E.mx === null ? 0 : bornes((E.mx - cx) / 220);
    var dy = E.my === null ? 0 : bornes((E.my - cy) / 220);
    E.t += dt;
    var dessus = E.mx !== null && E.mx >= r.left && E.mx <= r.right && E.my >= r.top && E.my <= r.bottom;
    if (dessus && !E.dessus) E.vel += (E.mx < cx ? 1 : -1) * 1.3;
    E.dessus = dessus;
    var cible = Math.sin(E.t / 90) * 1.2;
    E.vel += (cible - E.ang) * 0.022 * dt;
    E.vel *= Math.pow(0.965, dt);
    E.ang += E.vel * dt;
    var pend = l.querySelector(".pendule"), pu = l.querySelector(".pupilles");
    if (pend) pend.style.transform = "rotate(" + E.ang.toFixed(2) + "deg)";
    var tx = dx * 3.2, ty = dy * 2.4, k = 1 - Math.pow(0.82, dt);
    E.px += (tx - E.px) * k; E.py += (ty - E.py) * k;
    if (pu) pu.style.transform = "translate(" + E.px.toFixed(2) + "px," + E.py.toFixed(2) + "px)";
  }
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);
window.addEventListener("hashchange", function () {
  var t = location.hash.slice(1);
  if (["aujourdhui", "calendrier", "ramadan", "apropos"].indexOf(t) >= 0 && t !== etat.tab) { etat.tab = t; rendre(); }
});
(function () {
  try {
    var q = new URLSearchParams(location.search).get("jour"), n = parseInt(q, 10);
    if (PROTO && n >= 1 && n <= NB) { etat.apercu = true; etat.jourApercu = n; }
  } catch (e) {}
  var t = location.hash.slice(1);
  if (["aujourdhui", "calendrier", "ramadan", "apropos"].indexOf(t) >= 0) etat.tab = t;
  rendre();
})();
